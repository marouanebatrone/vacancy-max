name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  contract:
    # The frontend's types are generated from the backend's OpenAPI document.
    # If someone changes a serializer without regenerating, this fails loudly
    # instead of shipping a frontend that lies about the API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --all-groups
        working-directory: backend
      - run: uv run python manage.py spectacular --file /tmp/schema.yaml
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: npm ci
        working-directory: frontend
      - run: npx openapi-typescript /tmp/schema.yaml -o src/shared/api/schema.d.ts
        working-directory: frontend
      # Format identically to the committed file, so the diff below reports
      # real contract changes and never a whitespace difference.
      - run: npx prettier --write src/shared/api/schema.d.ts
        working-directory: frontend
      - name: Fail if generated API types are stale
        run: git diff --exit-code -- src/shared/api/schema.d.ts
        working-directory: frontend
