# Moroccan public holidays -- the source of truth for this application.
#
# Edited by hand, reviewed like code. Two sections, because the two kinds of
# holiday have genuinely different epistemics:
#
#   fixed  Same Gregorian date every year. Certain. Expanded for any year.
#   hijri  Lunar. Listed per year, because the date moves ~11 days earlier
#          annually AND is fixed officially only by moon sighting, announced
#          by the Ministry of Habous and Islamic Affairs days in advance.
#
# !! The hijri dates below are ASTRONOMICAL ESTIMATES and carry
#    `is_confirmed: false`. Once Morocco announces the real date, correct the
#    entry and flip the flag -- that is a one-line PR, which is exactly why
#    this data lives in YAML and not in a migration.

country: MA
weekend: [saturday, sunday]

fixed:
  - slug: new-year
    month: 1
    day: 1
    name: New Year's Day
    name_fr: Jour de l'An
    name_ar: رأس السنة الميلادية

  - slug: independence-manifesto
