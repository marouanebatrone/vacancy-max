repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        # Run from the repo root: pre-commit passes repo-relative paths, and
        # prettier finds frontend/.prettierrc by walking up from each file.
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^frontend/(src|tests)/.*\.(ts|tsx|css)$
